# Builds the web app (PWA) and publishes it for free on GitHub Pages:
#   https://<user>.github.io/<repo>/
# One-time: Settings → Pages → Source: "GitHub Actions".
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   SUPABASE_URL, SUPABASE_ANON_KEY  → account, sync & community (otherwise local mode)
#   AI_ENABLED=true                  → show AI features (needs GEMINI_API_KEY on Supabase)
name: Deploy PWA (GitHub Pages)
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web app
        working-directory: apps/mobile
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_AI_ENABLED: ${{ vars.AI_ENABLED || 'false' }}
        run: npx expo export --platform web --output-dir dist --clear
      - run: node scripts/pwa-base.mjs apps/mobile/dist /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages ist noch nicht aktiviert (Settings → Pages → Source: GitHub Actions). Build ok, Veröffentlichung übersprungen."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
