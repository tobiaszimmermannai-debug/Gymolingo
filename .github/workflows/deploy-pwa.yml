# Builds the web app (PWA) and publishes it for free on GitHub Pages:
#   https://<user>.github.io/<repo>/
# One-time: Settings → Pages → Source: "GitHub Actions".
# Backend (optional): public Supabase URL + publishable key in config/backend.env
# (or repository variables SUPABASE_URL / SUPABASE_ANON_KEY). Empty = local mode.
# AI: each tester stores a free Gemini key in the app (Settings → KI);
#     set the variable AI_ENABLED=false to hide AI entirely.
name: Deploy PWA (GitHub Pages)
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backend config (public values)
        env:
          V_URL: ${{ vars.SUPABASE_URL }}
          V_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          URL="$V_URL"; KEY="$V_KEY"
          if [ -z "$URL" ] && [ -f config/backend.env ]; then
            URL="$(grep -E '^SUPABASE_URL=' config/backend.env | cut -d= -f2-)"
            KEY="$(grep -E '^SUPABASE_ANON_KEY=' config/backend.env | cut -d= -f2-)"
          fi
          echo "EXPO_PUBLIC_SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"
          if [ -n "$URL" ]; then echo "::notice::Backend: $URL"; else echo "::notice::Kein Backend konfiguriert – lokaler Modus."; fi
      - name: Build web app
        working-directory: apps/mobile
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_AI_ENABLED: ${{ vars.AI_ENABLED || 'true' }}
        run: npx expo export --platform web --output-dir dist --clear
      - run: node scripts/pwa-base.mjs apps/mobile/dist /${{ github.event.repository.name }}
      - name: Check Supabase setup (public key only)
        run: node scripts/check-backend.mjs || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages ist noch nicht aktiviert (Settings → Pages → Source: GitHub Actions). Build ok, Veröffentlichung übersprungen."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
